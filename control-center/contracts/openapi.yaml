openapi: 3.0.3
info:
  title: Homelab Control Center API
  version: 0.1.0
  description: Read-only control plane for gate P0-A and P0-B. Deploy writes return FEATURE_DISABLED.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/health:
    get:
      summary: Liveness and readiness
      responses:
        "200":
          description: Ready
  /api/v1/session:
    post:
      summary: Create a loopback admin session
      responses:
        "200":
          description: Session cookies set
        "401":
          description: Denied
  /api/v1/overview:
    get:
      summary: Host, Docker, Traefik, and tunnel observation
      responses:
        "200":
          description: Aggregated status
        "401":
          description: Auth required
  /api/v1/hosts:
    get:
      summary: Observed hosts
      responses:
        "200":
          description: Host list
  /api/v1/hosts/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One host
  /api/v1/apps:
    get:
      parameters:
        - in: query
          name: managed
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Managed and unmanaged apps
    post:
      summary: Disabled until a later gate
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "403":
          description: FEATURE_DISABLED
  /api/v1/apps/validate:
    post:
      summary: Disabled dry-run
      responses:
        "403":
          description: FEATURE_DISABLED
  /api/v1/apps/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Observed app
    delete:
      responses:
        "403":
          description: FEATURE_DISABLED for managed apps
        "409":
          description: UNMANAGED_APP
  /api/v1/apps/{id}/logs:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: tail
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Bounded redacted logs
  /api/v1/apps/{id}/actions:
    post:
      responses:
        "403":
          description: FEATURE_DISABLED
        "409":
          description: UNMANAGED_APP
  /api/v1/jobs:
    get:
      responses:
        "200":
          description: Latest jobs
  /api/v1/jobs/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One job
  /api/v1/audit:
    get:
      responses:
        "200":
          description: Sanitized audit events
  /api/v1/routes:
    get:
      responses:
        "200":
          description: Read-only DNS routes or unconfigured integration
  /api/v1/integrations/cloudflare/status:
    get:
      responses:
        "200":
          description: Permission state without a token
  /agent/v1/poll:
    post:
      summary: Signed observation from the host agent
      responses:
        "200":
          description: Pending observe_logs jobs
        "401":
          description: Bad signature or replay
  /agent/v1/jobs/{id}/result:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored redacted result
components:
  schemas:
    Problem:
      type: object
      required: [code, message, requestId, retryable, remediation]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
        details: { type: object }
        remediation: { type: string }

name: homelab-status

services:
  status:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./www/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_edge"
      - "traefik.http.routers.homelab-status.rule=Host(`${STATUS_HOST:?Set STATUS_HOST in root .env}`)"
      - "traefik.http.routers.homelab-status.entrypoints=web"
      - "traefik.http.services.homelab-status.loadbalancer.server.port=80"

networks:
  edge:
    external: true
    name: homelab_edge
